<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="book" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#FFA500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Book -->
  <g transform="translate(256,285)" filter="url(#glow)">
    <!-- Left page -->
    <path d="M-20,-55 L-20,70 L-135,55 L-135,-40 Z" fill="#FFF8DC" stroke="url(#book)" stroke-width="4"/>
    <!-- Right page -->
    <path d="M20,-55 L20,70 L135,55 L135,-40 Z" fill="#FFFACD" stroke="url(#book)" stroke-width="4"/>
    <!-- Spine -->
    <path d="M-20,-55 L0,-70 L20,-55" fill="none" stroke="url(#book)" stroke-width="5"/>
    <line x1="0" y1="-70" x2="0" y2="75" stroke="url(#book)" stroke-width="3"/>
    <!-- Page lines left -->
    <line x1="-110" y1="-15" x2="-40" y2="-25" stroke="#D4A574" stroke-width="1.5" opacity="0.4"/>
    <line x1="-110" y1="5" x2="-40" y2="-5" stroke="#D4A574" stroke-width="1.5" opacity="0.4"/>
    <line x1="-110" y1="25" x2="-40" y2="15" stroke="#D4A574" stroke-width="1.5" opacity="0.4"/>
    <!-- Page lines right -->
    <line x1="40" y1="-25" x2="110" y2="-15" stroke="#D4A574" stroke-width="1.5" opacity="0.4"/>
    <line x1="40" y1="-5" x2="110" y2="5" stroke="#D4A574" stroke-width="1.5" opacity="0.4"/>
    <line x1="40" y1="15" x2="110" y2="25" stroke="#D4A574" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- Stars -->
  <g fill="#FFD700">
    <circle cx="160" cy="120" r="8" opacity="0.9"/>
    <circle cx="360" cy="100" r="6" opacity="0.8"/>
    <circle cx="256" cy="80" r="10" opacity="1"/>
    <circle cx="128" cy="175" r="5" opacity="0.7"/>
    <circle cx="390" cy="160" r="7" opacity="0.8"/>
    <circle cx="200" cy="95" r="5" opacity="0.7"/>
    <circle cx="320" cy="135" r="8" opacity="0.9"/>
    <circle cx="100" cy="250" r="4" opacity="0.5"/>
    <circle cx="420" cy="240" r="5" opacity="0.5"/>
  </g>
  <!-- Sparkle lines -->
  <g stroke="#FFD700" stroke-width="3" opacity="0.8" stroke-linecap="round">
    <line x1="256" y1="150" x2="256" y2="120"/>
    <line x1="215" y1="165" x2="195" y2="135"/>
    <line x1="297" y1="165" x2="317" y2="135"/>
    <line x1="240" y1="155" x2="225" y2="130"/>
    <line x1="272" y1="155" x2="287" y2="130"/>
  </g>
</svg>
