    <script>
        window.tempErrorHandler = function(msg, url, line, col, error) {
            const errDiv = document.createElement('div');
            errDiv.style.background = '#AA0000';
            errDiv.style.color = '#FFFFFF';
            errDiv.style.padding = '20px';
            errDiv.style.position = 'fixed';
            errDiv.style.top = '0';
            errDiv.style.left = '0';
            errDiv.style.width = '100%';
            errDiv.style.zIndex = '999999';
            errDiv.style.fontFamily = 'monospace';
            errDiv.innerHTML = `<h3>⚠️ Erro Crítico Local</h3>
                                <p><strong>Msg:</strong> ${msg}</p>
                                <p><strong>Onde:</strong> ${url}:${line}:${col}</p>
                                <p style="font-size:0.8em; opacity:0.8;">Tente acessar em aba anônima para ignorar cache de PWA.</p>
                                <button onclick="this.parentElement.remove()" style="margin-top:10px; padding:5px 10px; color:black;">X Fechar</button>`;
            document.body.prepend(errDiv);
        };
        window.addEventListener('error', function(event) {
            window.tempErrorHandler(event.message, event.filename, event.lineno, event.colno, event.error);
        });
    </script>

    <!-- ⚙️ CONFIG DE PRODUCÃO (substituir env vars na Vercel) -->
    <meta name="fz-n8n-webhook" content="__N8N_WEBHOOK_BASE_URL__">
    <script>
        // Lê a URL do N8N do atributo meta. Se ainda for placeholder (modo dev ou não configurado),
        // usa o fallback local. Na Vercel, configurar a env var N8N_WEBHOOK_BASE_URL.
        window.FabulaZenConfig = (function() {
            var meta = document.querySelector('meta[name="fz-n8n-webhook"]');
            var value = meta ? meta.getAttribute('content') : '';
            return {
                N8N_WEBHOOK_URL: (value && !value.startsWith('__'))
                    ? value
                    : 'http://localhost:5678/webhook'
            };
        })();
    </script>
